<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TENDERBOX 4 - Webpublisher</title>
<style>
  :root {
    --tbx-green: #6fa93f;
    --tbx-green-dark: #5a8a32;
    --tbx-green-pale: #dff0c8;
    --tbx-page-bg: #f4f5f6;
    --tbx-card-bg: #ffffff;
    --tbx-border: #e6e7e9;
    --tbx-text: #2b2d33;
    --tbx-text-muted: #7a7d85;
    --tbx-status-progress-bg: #dff0c8;
    --tbx-status-progress-fg: #4c7a26;
    --tbx-status-finished-bg: #e7e8ea;
    --tbx-status-finished-fg: #6b6e75;
    --tbx-status-cancelled-bg: #f7dede;
    --tbx-status-cancelled-fg: #a13a3a;
    --radius: 10px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, a, input, select, [role="button"] { -webkit-tap-highlight-color: transparent; outline: none; }
  button:focus-visible, a:focus-visible, input:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--tbx-green); outline-offset: 2px;
  }

  body { margin: 0; }

  @keyframes tbxFadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes tbxFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes tbxScaleIn {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tbx-wp {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--tbx-text);
    background: var(--tbx-page-bg);
    max-width: 1280px;
    margin: 0 auto;
    animation: tbxFadeIn .4s ease both;
  }

  /* ---------- top bar ---------- */
  .tbx-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fafafa;
    border-bottom: 1px solid var(--tbx-border);
    padding: 14px 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .tbx-brand { display: flex; align-items: center; gap: 22px; }
  .tbx-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
  .tbx-logo-icon {
    width: 26px; height: 26px; background: var(--tbx-green);
    border-radius: 5px; display: flex; align-items: center; justify-content: center;
    transition: transform .2s ease;
  }
  .tbx-logo:hover .tbx-logo-icon { transform: rotate(-6deg) scale(1.06); }
  .tbx-logo-icon span { width: 10px; height: 10px; background: #fff; border-radius: 2px; }
  .tbx-page-title { font-weight: 700; font-size: 18px; color: var(--tbx-text); }

  /* ---------- domain switcher (testovací nástroj, ne pro finální embed) ---------- */
  .tbx-domain-switch { display: flex; align-items: center; gap: 8px; }
  .tbx-domain-switch input {
    height: 34px; width: 260px; border: 1px solid var(--tbx-border); border-radius: 8px;
    padding: 0 10px; font-size: 13px; color: var(--tbx-text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .tbx-domain-switch input:focus {
    outline: none; border-color: var(--tbx-green);
    box-shadow: 0 0 0 3px rgba(111, 169, 63, 0.18);
  }
  .tbx-domain-switch .tbx-btn { height: 34px; padding: 0 14px; }

  /* ---------- content card ---------- */
  .tbx-card {
    background: var(--tbx-card-bg);
    margin: 0;
    border-bottom: 1px solid var(--tbx-border);
  }
  .tbx-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 22px 24px 18px;
  }
  .tbx-card-title { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
  .tbx-card-title .tbx-logo-icon { width: 24px; height: 24px; }

  .tbx-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tbx-select, .tbx-search, .tbx-filter-btn {
    height: 38px;
    border: 1px solid var(--tbx-border);
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    color: var(--tbx-text);
    transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease, transform .1s ease;
  }
  .tbx-select:focus, .tbx-search:focus {
    outline: none;
    border-color: var(--tbx-green);
    box-shadow: 0 0 0 3px rgba(111, 169, 63, 0.18);
  }
  .tbx-select { padding: 0 12px; min-width: 150px; appearance: none; background-image: none; cursor: pointer; }
  .tbx-search-wrap {
    position: relative; display: flex; align-items: stretch;
    border: 1px solid var(--tbx-border); border-radius: 8px; background: #fff; overflow: hidden;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .tbx-search-wrap:focus-within { border-color: var(--tbx-green); box-shadow: 0 0 0 3px rgba(111, 169, 63, 0.18); }
  .tbx-search { padding: 0 12px; width: 220px; height: 38px; border: none; border-radius: 0; }
  .tbx-search:focus { box-shadow: none; }
  .tbx-search-icon-box {
    display: flex; align-items: center; justify-content: center; width: 40px; flex-shrink: 0;
    border-left: 1px solid var(--tbx-border); color: var(--tbx-text-muted);
  }
  .tbx-search-icon-box svg { width: 16px; height: 16px; fill: currentColor; }
  .tbx-filter-btn { padding: 0 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; background: var(--tbx-page-bg); }
  .tbx-filter-btn:hover { background: #ececed; border-color: #d5d7da; }
  .tbx-filter-btn:active { transform: scale(.97); }
  .tbx-filter-btn svg { width: 15px; height: 15px; fill: var(--tbx-text-muted); }

  /* ---------- vlastní (custom) dropdown, náhrada za nativní <select> ---------- */
  .tbx-csel { position: relative; }
  .tbx-csel-trigger {
    height: 38px; padding: 0 34px 0 12px; border: 1px solid var(--tbx-border); border-radius: 8px;
    background: #fff; font-size: 14px; color: var(--tbx-text); cursor: pointer;
    display: flex; align-items: center; min-width: 150px; white-space: nowrap; width: 100%;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .tbx-csel-trigger:hover { border-color: #cfd1d4; }
  .tbx-csel.tbx-open .tbx-csel-trigger { border-color: var(--tbx-green); box-shadow: 0 0 0 3px rgba(111, 169, 63, 0.18); }
  .tbx-csel-label { overflow: hidden; text-overflow: ellipsis; }
  .tbx-csel-chevron {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; fill: var(--tbx-text-muted); pointer-events: none;
    transition: transform .15s ease;
  }
  .tbx-csel.tbx-open .tbx-csel-chevron { transform: translateY(-50%) rotate(180deg); }
  .tbx-csel-menu {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 100%;
    background: #fff; border: 1px solid var(--tbx-border); border-radius: 12px;
    box-shadow: 0 12px 28px rgba(0,0,0,.12); padding: 8px; z-index: 60;
    max-height: 260px; overflow-y: auto;
    opacity: 0; transform: translateY(-4px); pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .tbx-csel.tbx-open .tbx-csel-menu { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .tbx-csel-option {
    padding: 9px 10px; border-radius: 8px; font-size: 14px; color: var(--tbx-text);
    cursor: pointer; white-space: nowrap; transition: background-color .12s ease;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .tbx-csel-option:hover { background: var(--tbx-page-bg); }
  .tbx-csel-option.tbx-active { background: transparent; color: var(--tbx-text); font-weight: 400; }
  .tbx-csel-radio {
    width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--tbx-border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .tbx-csel-option.tbx-active .tbx-csel-radio { background: var(--tbx-green); border-color: var(--tbx-green); }
  .tbx-csel-radio svg { width: 11px; height: 11px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .1s ease; }
  .tbx-csel-option.tbx-active .tbx-csel-radio svg { opacity: 1; }
  .tbx-csel--block .tbx-csel-trigger { height: 42px; }
  .tbx-pagination-controls .tbx-csel .tbx-csel-trigger { height: 36px; min-width: 120px; }

  /* ---------- vlastní kalendář ---------- */
  .tbx-cal-input { cursor: pointer; }
  .tbx-cal-popup {
    position: fixed; z-index: 1200;
    width: 320px; background: #fff; border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.16); border: 1px solid var(--tbx-border);
    padding: 22px 24px;
    opacity: 0; pointer-events: none; transform: translateY(-6px);
    transition: opacity .15s ease, transform .15s ease;
  }
  .tbx-cal-popup.tbx-open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .tbx-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .tbx-cal-title { font-weight: 700; font-size: 15px; }
  .tbx-cal-nav {
    width: 28px; height: 28px; border: none; background: transparent; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--tbx-text-muted);
    transition: background-color .12s ease;
  }
  .tbx-cal-nav:hover { background: var(--tbx-page-bg); }
  .tbx-cal-nav svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tbx-cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: 13px; color: var(--tbx-text-muted); font-weight: 600; margin-bottom: 6px;
  }
  .tbx-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 10px; column-gap: 0; }
  .tbx-cal-day {
    height: 30px; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 14px; color: var(--tbx-text); cursor: pointer; border: none; background: transparent;
    transition: background-color .12s ease, color .12s ease;
  }
  .tbx-cal-day:hover { background: var(--tbx-page-bg); }
  .tbx-cal-day.tbx-today { font-weight: 700; color: var(--tbx-green-dark); }
  .tbx-cal-day.tbx-selected { background: transparent; color: var(--tbx-green-dark); font-weight: 700; }
  .tbx-cal-day.tbx-empty { cursor: default; }
  .tbx-cal-day.tbx-empty:hover { background: transparent; }
  .tbx-cal-time { display: flex; align-items: center; gap: 10px; margin: 18px 0 4px; font-size: 14px; color: var(--tbx-text); }
  .tbx-cal-time-input {
    width: 56px; height: 38px; border: 1px solid var(--tbx-border); border-radius: 8px;
    text-align: center; font-size: 14px; color: var(--tbx-text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .tbx-cal-time-input:focus { outline: none; border-color: var(--tbx-green); box-shadow: 0 0 0 3px rgba(111, 169, 63, 0.18); }
  .tbx-cal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .tbx-cal-actions .tbx-btn { height: 40px; padding: 0 18px; font-size: 14px; }

  /* ---------- table ---------- */
  .tbx-table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: var(--tbx-text-muted);
    padding: 10px 24px;
    border-bottom: 1px solid var(--tbx-border);
    white-space: nowrap;
  }
  tbody td {
    padding: 16px 24px;
    border-bottom: 1px solid var(--tbx-border);
    font-size: 15px;
    vertical-align: middle;
  }
  tbody tr {
    animation: tbxFadeIn .22s ease both;
    transition: background-color .15s ease;
  }
  tbody tr:hover { background: #fafbf8; }
  tbody tr:last-child td { border-bottom: none; }

  td.tbx-id { color: var(--tbx-text); font-weight: 500; }
  .tbx-row-icon { display: inline-flex; vertical-align: middle; margin-right: 10px; transition: transform .15s ease; }
  .tbx-row-icon svg { width: 18px; height: 18px; fill: var(--tbx-green); }
  tbody tr:hover .tbx-row-icon { transform: scale(1.12); }

  .tbx-pill {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    transition: transform .15s ease;
  }
  .tbx-pill.in_progress { background: var(--tbx-status-progress-bg); color: var(--tbx-status-progress-fg); }
  .tbx-pill.finished    { background: var(--tbx-status-finished-bg); color: var(--tbx-status-finished-fg); }
  .tbx-pill.cancelled   { background: var(--tbx-status-cancelled-bg); color: var(--tbx-status-cancelled-fg); }
  .tbx-pill.planned     { background: #eef3ff; color: #3a5ba0; }
  tbody tr:hover .tbx-pill { transform: scale(1.04); }

  td.tbx-actions { text-align: right; }
  .tbx-icon-link {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    color: var(--tbx-green-dark); text-decoration: none;
    border: none; background: transparent; cursor: pointer; padding: 0; font: inherit;
    transition: background-color .15s ease, transform .15s ease;
  }
  .tbx-icon-link:hover { background: var(--tbx-green-pale); transform: scale(1.08); }
  .tbx-icon-link:active { transform: scale(.95); }
  .tbx-icon-link svg { width: 18px; height: 18px; fill: currentColor; }

  .tbx-empty, .tbx-error {
    padding: 40px 24px;
    text-align: center;
    color: var(--tbx-text-muted);
    animation: tbxFadeIn .3s ease both;
  }
  .tbx-error { color: var(--tbx-status-cancelled-fg); }

  /* ---------- pagination ---------- */
  .tbx-pagination {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding: 14px 24px; border-top: 1px solid var(--tbx-border);
  }
  .tbx-pagination-info { font-size: 13px; color: var(--tbx-text-muted); }
  .tbx-pagination-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tbx-pagination-controls .tbx-select { height: 36px; min-width: 120px; }
  .tbx-pagination-controls .tbx-btn { height: 36px; padding: 0 14px; }
  .tbx-pagination-controls .tbx-btn:disabled { opacity: .45; cursor: not-allowed; }
  .tbx-pagination-controls .tbx-btn:disabled:hover { background: #fff; }

  /* ---------- footer ---------- */
  .tbx-footer {
    padding: 18px 24px;
    text-align: center;
    font-size: 13px;
    color: var(--tbx-text-muted);
  }
  .tbx-footer a { color: var(--tbx-green-dark); text-decoration: none; }
  .tbx-footer a:hover { text-decoration: underline; }

  /* ---------- filter modal ---------- */
  .tbx-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 22, 20, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .tbx-modal-overlay.tbx-open {
    opacity: 1;
    pointer-events: auto;
  }
  .tbx-modal {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 560px;
    padding: 28px 32px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(16px) scale(.97);
    opacity: 0;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
  }
  .tbx-modal-overlay.tbx-open .tbx-modal {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  .tbx-modal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .tbx-modal-head h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .tbx-modal-close {
    border: none; background: transparent; cursor: pointer;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    color: var(--tbx-text); border-radius: 6px;
    transition: background-color .15s ease, transform .15s ease;
  }
  .tbx-modal-close:hover { background: var(--tbx-page-bg); transform: rotate(90deg); }
  .tbx-modal-close svg { width: 18px; height: 18px; fill: currentColor; }

  /* ---------- detail modal layout (napodobuje adminovský vzhled) ---------- */
  #tbx-detail-modal { max-width: 900px; }
  .tbx-detail-grid { display: grid; grid-template-columns: 190px 1fr; gap: 28px; }
  .tbx-detail-sidebar { border-right: 1px solid var(--tbx-border); padding-right: 20px; }
  .tbx-detail-logo-box {
    width: 100%; aspect-ratio: 3/2; border: 1px solid var(--tbx-border); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
    overflow: hidden; background: #fff; padding: 10px;
    animation: tbxScaleIn .28s ease both;
  }
  .tbx-detail-logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tbx-detail-logo-fallback { font-weight: 800; font-size: 20px; color: var(--tbx-green-dark); letter-spacing: .02em; text-align: center; }
  .tbx-detail-nav-title { font-size: 11px; font-weight: 700; color: var(--tbx-text-muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 8px; animation: tbxFadeIn .3s ease both; }
  .tbx-detail-nav-title:first-child { margin-top: 0; }
  .tbx-detail-nav-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px;
    color: var(--tbx-text); font-size: 14px; cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
    animation: tbxFadeIn .25s ease both;
  }
  .tbx-detail-nav-item svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; transition: transform .15s ease; }
  .tbx-detail-nav-item:not(.tbx-disabled):hover { background: var(--tbx-page-bg); }
  .tbx-detail-nav-item:not(.tbx-disabled):hover svg { transform: scale(1.12); }
  .tbx-detail-nav-item:not(.tbx-disabled):active { background: var(--tbx-green-pale); }
  .tbx-detail-nav-item.tbx-active { background: var(--tbx-green-pale); color: var(--tbx-green-dark); font-weight: 600; }
  .tbx-detail-nav-item.tbx-disabled { color: var(--tbx-text-muted); cursor: not-allowed; }
  .tbx-detail-sidebar .tbx-detail-nav-item:nth-of-type(1) { animation-delay: .05s; }
  .tbx-detail-sidebar .tbx-detail-nav-item:nth-of-type(2) { animation-delay: .1s; }
  .tbx-detail-sidebar .tbx-detail-nav-item:nth-of-type(3) { animation-delay: .15s; }

  .tbx-detail-org { color: var(--tbx-text-muted); font-size: 14px; margin-bottom: 4px; animation: tbxFadeIn .25s ease both; }
  .tbx-detail-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 22px; font-weight: 700; margin-bottom: 22px; animation: tbxFadeIn .25s ease both .05s; }
  .tbx-detail-title-row .tbx-pill { animation: tbxFadeIn .25s ease both .15s; }

  .tbx-detail-section-title {
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px;
    color: var(--tbx-text); margin: 0 0 12px;
    animation: tbxFadeIn .25s ease both;
  }
  .tbx-detail-section-title svg { width: 18px; height: 18px; fill: var(--tbx-green); }
  .tbx-detail-section { margin-bottom: 26px; }

  .tbx-detail-card {
    border: 1px solid var(--tbx-border); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;
    animation: tbxFadeIn .28s ease both;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .tbx-detail-card:hover { border-color: #cfe3bc; box-shadow: 0 4px 14px rgba(90, 138, 50, 0.08); }
  .tbx-detail-process-status { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 14px; }
  .tbx-detail-process-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tbx-detail-process-link { font-size: 13px; color: #3a6fd6; background: #eaf1ff; padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; transition: background-color .15s ease; }
  .tbx-detail-process-link:hover { background: #d8e6ff; }
  .tbx-detail-process-link svg { width: 8px; height: 8px; fill: #3a6fd6; }
  .tbx-detail-process-dates { color: var(--tbx-text-muted); font-size: 14px; margin-top: 8px; }

  .tbx-detail-field-row + .tbx-detail-field-row { border-top: 1px solid var(--tbx-border); }
  .tbx-detail-field-row {
    padding: 12px 0; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    animation: tbxFadeIn .22s ease both; transition: background-color .15s ease;
  }
  .tbx-detail-field-row:hover { background: #fafbf8; }
  .tbx-detail-field-row:first-child { padding-top: 0; }
  .tbx-detail-field-label { color: var(--tbx-text-muted); font-size: 14px; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
  .tbx-detail-field-value { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }

  /* ---------- posuvný seznam dokumentů (pokud je jich hodně) ---------- */
  .tbx-documents-scroll {
    max-height: 360px;
    overflow-y: auto;

  }
  .tbx-date-field input::placeholder { color: #b6b8bc; }
  .tbx-select-field select:focus,
  .tbx-date-field input:focus {
    outline: none;

  }

  .tbx-modal-footer {
    display: flex; align-items: center; justify-content: space-between;

  .tbx-btn {
    height: 42px; padding: 0 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--tbx-border);
    background: #fff; color: var(--tbx-text);

  }
  .tbx-btn:hover { background: var(--tbx-page-bg); }

    background: var(--tbx-green-pale); color: var(--tbx-green-dark); border-color: var(--tbx-green-pale);
  }
  .tbx-btn-apply:hover { background: #d2eab6; }
  .tbx-btn-apply svg { width: 15px; height: 15px; fill: currentColor; }
  .tbx-modal-footer-right { display: flex; gap: 10px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {

</style>

<script>
(function () {
  // ---------------------------------------------------------------------
  // Vlastní (custom) dropdown - náhrada nativního <select>, jednotný vzhled
  // napříč prohlížeči/OS a plná kontrola nad otevírací animací.
  // ---------------------------------------------------------------------
  function createCustomSelect(container, { options, value = "", onChange, placeholder = "" }) {
    container.classList.add("tbx-csel");
    container.innerHTML =
      '<button type="button" class="tbx-csel-trigger">' +
        '<span class="tbx-csel-label"></span>' +
        '<svg class="tbx-csel-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>' +
      '</button>' +
      '<div class="tbx-csel-menu"></div>';

    const trigger = container.querySelector(".tbx-csel-trigger");
    const label = container.querySelector(".tbx-csel-label");
    const menu = container.querySelector(".tbx-csel-menu");
    let opts = options;
    let current = value;

    function renderMenu() {
      menu.innerHTML = opts.map((o) =>
        `<div class="tbx-csel-option ${o.value === current ? "tbx-active" : ""}" data-value="${o.value}">` +
          `<span>${o.label}</span>` +
          `<span class="tbx-csel-radio"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>` +
        `</div>`
      ).join("");
    }
    function renderLabel() {
      const found = opts.find((o) => o.value === current);
      label.textContent = found ? found.label : placeholder;
    }
    function open() {
      document.querySelectorAll(".tbx-csel.tbx-open").forEach((el) => { if (el !== container) el.classList.remove("tbx-open"); });
      container.classList.add("tbx-open");
    }
    function close() { container.classList.remove("tbx-open"); }

    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      container.classList.contains("tbx-open") ? close() : open();
    });
    menu.addEventListener("click", (e) => {
      const opt = e.target.closest(".tbx-csel-option");
      if (!opt) return;
      current = opt.getAttribute("data-value");
      renderMenu(); renderLabel(); close();
      if (onChange) onChange(current);
    });

    renderMenu(); renderLabel();

    return {
      getValue: () => current,
      setValue(v, silentOpts) {
        current = v; renderMenu(); renderLabel();
        if (!(silentOpts && silentOpts.silent) && onChange) onChange(current);
      },
      setOptions(newOpts) { opts = newOpts; renderMenu(); renderLabel(); },
      close
    };
  }
  document.addEventListener("click", () => {
    document.querySelectorAll(".tbx-csel.tbx-open").forEach((el) => el.classList.remove("tbx-open"));
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.querySelectorAll(".tbx-csel.tbx-open").forEach((el) => el.classList.remove("tbx-open"));
  });

  // ---------------------------------------------------------------------
  // Vlastní kalendář - jeden sdílený popup pro všechna datumová pole filtru.
  // ---------------------------------------------------------------------
  const MONTH_NAMES = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];

  function pad2(n) { return String(n).padStart(2, "0"); }
  function formatForInput(d) {
    return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  function initCalendar() {
    const popup = document.getElementById("tbx-cal-popup");
    const titleEl = document.getElementById("tbx-cal-title");
    const gridEl = document.getElementById("tbx-cal-grid");
    const prevBtn = document.getElementById("tbx-cal-prev");
    const nextBtn = document.getElementById("tbx-cal-next");
    const hhInput = document.getElementById("tbx-cal-hh");
    const mmInput = document.getElementById("tbx-cal-mm");
    const applyBtn = document.getElementById("tbx-cal-apply");
    const clearBtn = document.getElementById("tbx-cal-clear");

    let targetInput = null;
    let viewYear, viewMonth, selectedDate;

    function render() {
      titleEl.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
      const firstOfMonth = new Date(viewYear, viewMonth, 1);
      // pondělí = 0 ... neděle = 6
      const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const today = new Date();

      let html = "";
      for (let i = 0; i < leadingBlanks; i++) html += '<div class="tbx-cal-day tbx-empty"></div>';
      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === day;
        const isSelected = selectedDate && selectedDate.getFullYear() === viewYear && selectedDate.getMonth() === viewMonth && selectedDate.getDate() === day;
        const cls = ["tbx-cal-day"];
        if (isToday) cls.push("tbx-today");
        if (isSelected) cls.push("tbx-selected");
        html += `<button type="button" class="${cls.join(" ")}" data-day="${day}">${day}</button>`;
      }
      gridEl.innerHTML = html;
    }

    function open(input) {
      targetInput = input;
      const existing = parseDateInput(input.value);
      const base = existing || new Date();
      viewYear = base.getFullYear();
      viewMonth = base.getMonth();
      selectedDate = existing || null;
      hhInput.value = pad2(existing ? existing.getHours() : 0);
      mmInput.value = pad2(existing ? existing.getMinutes() : 0);
      render();

      const rect = input.getBoundingClientRect();
      const popupWidth = 280;
      let left = rect.left;
      if (left + popupWidth > window.innerWidth - 12) left = window.innerWidth - popupWidth - 12;
      if (left < 12) left = 12;
      let top = rect.bottom + 6;
      if (top + 360 > window.innerHeight) top = Math.max(12, rect.top - 366);
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;

      document.querySelectorAll(".tbx-csel.tbx-open").forEach((el) => el.classList.remove("tbx-open"));
      popup.classList.add("tbx-open");
    }
    function close() { popup.classList.remove("tbx-open"); targetInput = null; }

    document.querySelectorAll(".tbx-cal-input").forEach((input) => {
      input.addEventListener("click", (e) => { e.stopPropagation(); open(input); });
    });

    gridEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".tbx-cal-day:not(.tbx-empty)");
      if (!btn) return;
      selectedDate = new Date(viewYear, viewMonth, parseInt(btn.getAttribute("data-day"), 10));
      render();
    });
    prevBtn.addEventListener("click", () => {
      viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      render();
    });
    nextBtn.addEventListener("click", () => {
      viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      render();
    });
    applyBtn.addEventListener("click", () => {
      if (!targetInput) return;
      if (!selectedDate) selectedDate = new Date(viewYear, viewMonth, new Date().getDate());
      const hh = Math.min(23, Math.max(0, parseInt(hhInput.value, 10) || 0));
      const mm = Math.min(59, Math.max(0, parseInt(mmInput.value, 10) || 0));
      const finalDate = new Date(viewYear, viewMonth, selectedDate.getDate(), hh, mm);

  function parseDateInput(value) {

    const m = value.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?$/);
    if (!m) return null;
    const [, dd, mm, yyyy, hh, min] = m;
    const d = new Date(Number(yyyy), Number(mm) - 1, Number(dd), Number(hh || 0), Number(min || 0));
    return isNaN(d) ? null : d;
  }

      if (!apiUrl || apiUrl === "mock") {
        detailState.documents = tender.documents || []; // mock ukázka bez dokumentů
      } else {
        const base = apiUrl.split("?")[0];
        const res = await fetch(`${base}/${tender.id}/documents`, { headers: { Accept: "application/json" }, credentials: "include" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        detailState.documents = await res.json();
      }
    } catch (err) {
      detailState.documents = "error";
    }
    renderDetailModal();
  }

  function renderDetailModal() {
    detailBody.innerHTML = `
      <div class="tbx-detail-grid">
        <div class="tbx-detail-sidebar">${sidebarHtml()}</div>
        <div>${detailState.view === "documents" ? documentsMainHtml() : overviewMainHtml()}</div>
      </div>`;
    if (detailState.view === "documents") ensureDocumentsLoaded();
  }

  detailBody.addEventListener("click", (e) => {
    const navItem = e.target.closest("[data-detail-view]");
    if (navItem) {
      detailState.view = navItem.getAttribute("data-detail-view");
      renderDetailModal();
    }
  });

  function closeDetailModal() { detailOverlay.classList.remove("tbx-open"); }
  detailClose.addEventListener("click", closeDetailModal);
  detailOverlay.addEventListener("click", (e) => { if (e.target === detailOverlay) closeDetailModal(); });

  async function openDetailModal(id) {
    detailOverlay.classList.add("tbx-open");
    detailTitle.textContent = "";
    detailBody.innerHTML = '<div class="tbx-empty"><span class="tbx-spinner"></span>Načítám detail...</div>';

    const apiUrl = root.getAttribute("data-api");
    try {
      let tender;
      if (!apiUrl || apiUrl === "mock") {
        tender = RAW_API_SAMPLE.find((t) => String(t.id) === String(id));
        if (!tender) throw new Error("tendr nenalezen v ukázkových datech");
      } else {
        const base = apiUrl.split("?")[0]; // .../api/tenders
        const res = await fetch(`${base}/${id}`, { headers: { Accept: "application/json" }, credentials: "include" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        tender = await res.json();
      }
      detailState = { tender, apiBase: apiUrl, view: "overview", documents: null };
      renderDetailModal();
    } catch (err) {
      detailBody.innerHTML = `<div class="tbx-error">Detail se nepodařilo načíst (${err.message}).</div>`;
    }
  }

  tbody.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-tender-id]");
    if (btn) openDetailModal(btn.getAttribute("data-tender-id"));
  });

  let searchDebounceTimer = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => { pageOffset = 0; loadData(); }, 350);
  });
  const statusFilter = createCustomSelect(statusFilterEl, {
    options: [
      { value: "", label: "Všechny stavy" },
      { value: "in_progress", label: "Probíhající" },
      { value: "finished", label: "Ukončené" },
      { value: "cancelled", label: "Zrušené" }
    ],
    value: "",
    onChange: () => { pageOffset = 0; loadData(); }
  });

  // ---------- stránkování ----------
  const pageSizeSelectEl = document.getElementById("tbx-page-size");
  const pagePrevBtn = document.getElementById("tbx-page-prev");
  const pageNextBtn = document.getElementById("tbx-page-next");
  const pageSizeSelect = createCustomSelect(pageSizeSelectEl, {
    options: [
      { value: "10", label: "10 / stránka" },
      { value: "20", label: "20 / stránka" },
      { value: "50", label: "50 / stránka" }
    ],
    value: String(pageSize),
    onChange: () => {
      pageSize = parseInt(pageSizeSelect.getValue(), 10);
      pageOffset = 0;
      loadData();
    }
  });
  pagePrevBtn.addEventListener("click", () => {
    pageOffset = Math.max(0, pageOffset - pageSize);
    loadData();
  });
  pageNextBtn.addEventListener("click", () => {
    pageOffset = pageOffset + pageSize;
    loadData();
  });

  // ---------------------------------------------------------------------
  // ADAPTÉR: převádí SKUTEČNOU odpověď z GET /api/tenders (pole objektů
  // tender, přesně jak je vidět v Network tabu) na formát, který tabulka
  // vykresluje. "Závěrečný proces" = poslední záznam v poli processes.
  // ---------------------------------------------------------------------
  function adaptFromTendersApi(rawTenders) {
    return {
      title: "Tendry",
      tenders: (rawTenders || [])
        .filter((t) => !t.settings?.isTest) // pojistka i pro případ, že by server parametr isTest ignoroval
        .map((t) => {
        const lastProcess = (t.processes && t.processes.length)
          ? t.processes[t.processes.length - 1]
          : null;
        const contact = (t.contactPersons && t.contactPersons.length) ? t.contactPersons[0] : null;
        const apiBase = (root.getAttribute("data-api") || "https://edu.proebiz.io/api/tenders").split("?")[0];
        const siteBase = apiBase.replace(/\/api\/tenders$/, "");
        return {
          id: String(t.id),
          name: t.subject,
          organization: t.organization?.name ?? "",
          organizationId: t.organization?.id ?? t.organizationId ?? null,
          startedAt: t.releasedAt,
          finalProcessBeginAt: lastProcess?.beginAt ?? null,
          finalProcessLabel: lastProcess
            ? `${fmtDate(lastProcess.beginAt)} - ${fmtDate(lastProcess.endAt)}`
            : "",
          contactName: contact?.name ?? "",
          contactEmail: contact?.email ?? "",
          participantCount: t.administration?.participantCount ?? null,
          status: t.isRunning ? "in_progress" : (t.isEnded ? "finished" : "planned"),
          // Skutečný formát ověřený proti reálné stránce (např. .../cs/tenders/370/summary):
          detailUrl: `${siteBase}/${t.locale || "cs"}/tenders/${t.id}/summary`
        };
      })
    };
  }

  // Sestaví query parametry přesně podle jmen z OpenAPI specifikace
  // GET /api/tenders (search, offset, limit, locale, status, organizationId,
  // releasedFrom/To, finalProcessFrom/To). Používá se jen když je nastaveno
  // skutečné data-api (ne "mock").
  function buildQueryParams() {
    const params = new URLSearchParams();
    const q = (searchInput.value || "").trim();
    if (q) params.set("search", q);
    if (statusFilter.getValue()) params.set("status", statusFilter.getValue());
    if (activeFilters.organizationId) params.set("organizationId", activeFilters.organizationId);
    const lockedOrgId = root.getAttribute("data-organization-id");
    if (lockedOrgId) params.set("organizationId", lockedOrgId); // embed napevno pro jednoho klienta - vyhraje nad ručním filtrem
    if (activeFilters.startedFrom) params.set("releasedFrom", activeFilters.startedFrom.toISOString());
    if (activeFilters.startedTo) params.set("releasedTo", activeFilters.startedTo.toISOString());
    if (activeFilters.finalFrom) params.set("finalProcessFrom", activeFilters.finalFrom.toISOString());
    if (activeFilters.finalTo) params.set("finalProcessTo", activeFilters.finalTo.toISOString());
    params.set("isTest", "false"); // veřejný webpublisher nesmí zobrazovat interní testovací tendry
    params.set("locale", "cs");
    params.set("offset", String(pageOffset));
    params.set("limit", String(pageSize));
    return params;
  }

  function updatePaginationUI(shownCount, knownTotal) {
    const info = document.getElementById("tbx-pagination-info");
    const prevBtn = document.getElementById("tbx-page-prev");
    const nextBtn = document.getElementById("tbx-page-next");
    if (shownCount === 0 && pageOffset === 0) {
      info.textContent = "Žádné tendry";
    } else {
      const from = pageOffset + 1;
      const to = pageOffset + shownCount;
      info.textContent = knownTotal != null ? `Zobrazeno ${from}–${to} z ${knownTotal}` : `Zobrazeno ${from}–${to}`;
    }
    prevBtn.disabled = pageOffset === 0;
    // bez celkového počtu v odpovědi API poznáme konec stránkování jen podle
    // toho, že přišlo méně záznamů, než jsme si vyžádali (limit)
    nextBtn.disabled = shownCount < pageSize;
  }

  let loadRequestId = 0;
  async function loadData() {
    const requestId = ++loadRequestId; // ochrana proti tomu, aby starší (pomalejší) požadavek přepsal novější odpověď
    const apiUrl = root.getAttribute("data-api");
    try {
      let data;
      let knownTotal = null;
      if (!apiUrl || apiUrl === "mock") {
        data = adaptFromTendersApi(RAW_API_SAMPLE);
        const lockedOrgId = root.getAttribute("data-organization-id");
        if (lockedOrgId) data.tenders = data.tenders.filter((t) => String(t.organizationId) === String(lockedOrgId));
        // v mock režimu známe přesný celkový počet, tak stránkujeme lokálně,
        // ať jde chování přepínačů otestovat i offline
        knownTotal = data.tenders.length;
        if (!orgOptionsLoaded) { populateOrgOptions(data.tenders); orgOptionsLoaded = true; } // z CELÉHO vzorku, ne jen aktuální stránky
        data.tenders = data.tenders.slice(pageOffset, pageOffset + pageSize);
      } else {
        // POZOR: /api/tenders běží na jiné doméně než klientský web, kam
        // se widget vloží → prohlížeč to zablokuje jako cross-origin
        // request, pokud edu.proebiz.io nevrací hlavičku
        // Access-Control-Allow-Origin. Podle OpenAPI specifikace navíc
        // endpoint formálně dědí globální "security: basicAuth" - je
        // potřeba ověřit v Network tabu (Headers), jestli a jak se
        // autentizace v praxi vyžaduje i pro čtení veřejných tendrů.
        const base = apiUrl.split("?")[0];
        const url = `${base}?${buildQueryParams().toString()}`;
        const res = await fetch(url, {
          headers: { Accept: "application/json" },
          credentials: "include" // pošle i session cookie, pokud edu.proebiz.io vyžaduje přihlášení
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();
        if (requestId !== loadRequestId) return; // mezitím proběhl novější požadavek, tenhle zahodíme
        data = Array.isArray(raw) ? adaptFromTendersApi(raw) : raw;
      }
      if (requestId !== loadRequestId) return;
      if (data.title) { caption.textContent = data.title; pageTitle.textContent = data.title; }
      allTenders = data.tenders || [];
      if (!orgOptionsLoaded) { populateOrgOptions(); orgOptionsLoaded = true; } // reálné API: org filtr se plní ze stránky, kterou server vrátí
      // mock režim dál filtruje lokálně (search/status), reálné API už
      // filtrované výsledky vrací samo přes query parametry výše
      if (!apiUrl || apiUrl === "mock") {
        applyFilters();
      } else {
        renderRows(allTenders);
      }
      updatePaginationUI(allTenders.length, knownTotal);
    } catch (err) {
      if (requestId !== loadRequestId) return; // starší selhaný požadavek - už nikoho nezajímá
      tbody.innerHTML = `<tr><td colspan="8" class="tbx-error">Data se nepodařilo načíst (${err.message}). Zkuste to prosím později.</td></tr>`;
    }
  }

  loadData();

  const refreshSeconds = parseInt(root.getAttribute("data-refresh-seconds") || "0", 10);
  if (refreshSeconds > 0) {
    setInterval(loadData, refreshSeconds * 1000);
  }
})();
</script>

</body>
</html>
